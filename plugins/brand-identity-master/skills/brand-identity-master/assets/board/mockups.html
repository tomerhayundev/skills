<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Mockup kit</title>
<!-- The mockup kit for the sample brand. Copy the pieces the direction and the sector call for into the board,
     inside scenes. Every piece reads --paper, --ink and --accent; set them from palette roles. Text with no
     source is an icon row or a .bar; headlines are the brand's own words; captions are deliverable names. -->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<style>.sheet { row-gap: 32px; }</style>
</head>
<body>
<main class="sheet">
  <section class="block span-12 cards" data-block="stationery">
    <div class="scene desk kit c-8 grain" data-ground="#2B2620" style="color: var(--color-neutral-light)">
      <p class="caption">Stationery</p>
      <div class="mockup" data-mockup="letterhead" style="width: 250px">
        <div class="k-letter lit grain" data-ground="#F4EFE6" style="color: var(--color-neutral-dark)">
          <img data-logo src="logo/monoDark.png" alt="">
          <span class="bar w40"></span><span class="bar w90"></span><span class="bar w90"></span><span class="bar w70"></span><span class="bar w90"></span><span class="bar w60"></span><span class="bar w30"></span>
          <span class="rule"></span>
          <span class="foot"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></span>
        </div>
      </div>
      <div class="mockup k-pair" data-mockup="card">
        <div class="k-card front lit tilt-l" data-ground="#15120E" style="--paper: var(--color-neutral-dark)"><img data-logo src="logo/original.svg" alt=""></div>
        <div class="k-card lit tilt-r grain" data-ground="#F4EFE6">
          <p class="k-name">Aurelle</p>
          <div class="k-rows">
            <div class="k-row"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span class="bar w60"></span></div>
            <div class="k-row"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span class="bar w70"></span></div>
            <div class="k-row"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg><span class="bar w50"></span></div>
          </div>
        </div>
      </div>
    </div>
    <div class="scene kit c-4" data-ground="#C9A24B" style="background: var(--color-primary); color: var(--color-primary-on)">
      <p class="caption">Packaging</p>
      <div class="mockup" data-mockup="bag">
        <div class="k-bag" style="--paper: var(--color-neutral-dark); --accent: var(--color-secondary)">
          <span class="handle" style="--handle: var(--color-neutral-dark)"></span>
          <div class="face lit" data-ground="#15120E"><img data-logo src="logo/original.svg" alt=""></div>
          <div class="side"><div class="pattern p-stroke-lines" style="--pattern-ink: rgb(244 239 230 / 0.3)"></div></div>
        </div>
      </div>
      <div class="mockup" data-mockup="box">
        <div class="k-box" style="--paper: var(--color-neutral-light); --accent: var(--color-secondary)">
          <div class="top"></div>
          <div class="front lit" data-ground="#F4EFE6"><div class="pattern p-stroke-rings" style="--pattern-ink: rgb(122 98 48 / 0.18)"></div><img data-logo src="logo/monoDark.png" alt=""></div>
          <div class="side"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="block span-12 cards" data-block="digital">
    <div class="scene kit c-8" data-ground="#15120E" style="background: var(--color-neutral-dark); color: var(--color-neutral-light)">
      <p class="caption">Website home</p>
      <div class="mockup" data-mockup="browser" style="width: 100%">
        <div class="k-browser">
          <div class="top"><i></i><i></i><i></i><span class="url"></span></div>
          <div class="k-site" data-ground="#F4EFE6">
            <nav><img data-logo src="logo/monoDark.png" alt=""><span>About</span><span>Contact</span><span class="k-btn" style="height: 34px">Book</span></nav>
            <div class="split">
              <div><h4>A small house for slow weekends.</h4><span class="bar w90"></span><span class="bar w60"></span></div>
              <div class="panel" data-ground="#15120E" style="background: var(--color-neutral-dark)"><div class="pattern p-stroke-rings" style="--pattern-ink: rgb(201 162 75 / 0.35)"></div><img data-logo src="logo/original.svg" alt=""></div>
            </div>
            <div class="features">
              <div class="feature"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18V7M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="2"/></svg><b>quiet</b><span class="bar w90"></span><span class="bar w60"></span></div>
              <div class="feature"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17M8 3v3M12 3v3"/></svg><b>warm metal</b><span class="bar w90"></span><span class="bar w50"></span></div>
              <div class="feature"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M15 8l2 2"/></svg><b>unhurried</b><span class="bar w80 w90"></span><span class="bar w60"></span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="scene kit c-4" data-ground="#7A6230" style="background: var(--color-secondary); color: var(--color-secondary-on)">
      <p class="caption">App screen</p>
      <div class="mockup" data-mockup="phone">
        <div class="k-phone">
          <div class="scr" data-ground="#15120E" style="--paper: var(--color-neutral-dark); --ink: var(--color-neutral-light)">
            <span class="notch"></span>
            <div class="status"><i></i><i></i></div>
            <div class="head"><img data-logo src="logo/original.svg" alt="" style="width: 44px"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></div>
            <div class="card-hero" data-ground="#C9A24B" style="background: var(--color-primary); color: var(--color-primary-on)"><div class="pattern p-stroke-rings" style="--pattern-ink: rgb(21 18 14 / 0.18)"></div><p>A small house for slow weekends.</p></div>
            <div class="k-list">
              <div class="k-item"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18V7M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="2"/></svg><span class="bar w70"></span></div>
              <div class="k-item"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="bar w60"></span></div>
            </div>
            <span class="k-btn">Reserve</span>
            <div class="k-tabs"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-8-4.8-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 9c0 6.2-8 11-8 11z"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="block span-12 cards" data-block="out-in-the-world">
    <div class="scene kit c-6" data-ground="#F4EFE6" style="background: var(--color-neutral-light); color: var(--color-neutral-dark)">
      <p class="caption">Storefront sign</p>
      <div class="mockup" data-mockup="sign" style="width: 100%">
        <div class="k-front" style="--paper: var(--color-neutral-dark); --accent: var(--color-primary)">
          <div class="fascia" data-ground="#15120E"><img data-logo src="logo/original.svg" alt=""></div>
          <div class="awning" style="--paper: var(--color-neutral-light)"></div>
          <div class="window"></div>
        </div>
      </div>
    </div>
    <div class="scene kit c-6" data-ground="#2B2620" style="background-color: #2B2620; color: var(--color-neutral-light)">
      <p class="caption">Social post</p>
      <div class="mockup" data-mockup="social">
        <div class="k-post lit">
          <div class="who" data-ground="#FFFFFF"><span class="avatar" style="--paper: var(--color-neutral-dark)"><img data-logo src="logo/original.svg" alt=""></span><span class="bar w40"></span></div>
          <div class="img" data-ground="#15120E" style="--paper: var(--color-neutral-dark); --ink: var(--color-neutral-light)"><div class="pattern p-stroke-rings" style="--pattern-ink: rgb(201 162 75 / 0.25)"></div><img data-logo src="logo/original.svg" alt=""><p>A small house for slow weekends.</p></div>
          <div class="acts"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-8-4.8-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 9c0 6.2-8 11-8 11z"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg></div>
          <div class="lines"><span class="bar w90"></span><span class="bar w60"></span></div>
        </div>
      </div>
      <div class="mockup" data-mockup="cup"><div class="k-cup" style="--paper: var(--color-neutral-light); --accent: var(--color-primary)"><span class="lid"></span><span class="body"></span><span class="sleeve" data-ground="#C9A24B"><img data-logo src="logo/reversed.png" alt=""></span></div></div>
      <div class="mockup" data-mockup="label"><div class="k-sticker" data-ground="#C9A24B" style="--paper: var(--color-neutral-light)"><img data-logo src="logo/reversed.png" alt=""></div></div>
    </div>
  </section>

  <section class="block span-12 cards" data-block="more">
    <div class="scene desk kit c-8 grain" data-ground="#2B2620" style="color: var(--color-neutral-light)">
      <p class="caption">Envelope</p>
      <div class="mockup" data-mockup="envelope"><div class="k-envelope lit grain" data-ground="#F4EFE6" style="width: 420px"><img data-logo src="logo/monoDark.png" alt=""></div></div>
      <div class="mockup" data-mockup="envelope"><div class="k-envelope lit tilt-r" data-ground="#15120E" style="--paper: var(--color-neutral-dark); width: 300px"><img data-logo src="logo/original.svg" alt=""></div></div>
    </div>
    <div class="scene kit c-4" data-ground="#7A6230" style="background: var(--color-secondary); color: var(--color-secondary-on)">
      <p class="caption">Tote bag</p>
      <div class="mockup" data-mockup="tote"><div class="k-tote lit" data-ground="#F4EFE6" style="--paper: var(--color-neutral-light)"><img data-logo src="logo/monoDark.png" alt=""></div></div>
    </div>
  </section>
</main>
</body>
</html>
