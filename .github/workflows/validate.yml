name: validate

on:
  push:
    branches: [main]
  pull_request:

# One run at a time per branch, so two sync commits never race.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the sync commit on push to main; pull requests stay read-only
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: The commit to compare versions against
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "BASE=origin/$BASE_REF" >> "$GITHUB_ENV"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "BASE=$BEFORE" >> "$GITHUB_ENV"
          else
            echo "BASE=HEAD~1" >> "$GITHUB_ENV"
          fi

      # A master edited on github.com, or a forgotten version bump, is fixed here and
      # committed back, so the specialists and installed copies always follow. A
      # hand-edited specialist fails this step instead of being overwritten.
      - name: Sync specialists, versions, catalog and README (push to main)
        if: github.event_name == 'push'
        run: |
          node scripts/sync.mjs --since="$BASE" > "$RUNNER_TEMP/sync.log" || { cat "$RUNNER_TEMP/sync.log"; exit 1; }
          cat "$RUNNER_TEMP/sync.log"
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            { echo "chore: sync generated skills and versions"; echo; grep '^synced ' "$RUNNER_TEMP/sync.log"; } > "$RUNNER_TEMP/msg.txt"
            git commit -q -F "$RUNNER_TEMP/msg.txt"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Specialists and versions in step (pull request)
        if: github.event_name == 'pull_request'
        run: node scripts/sync.mjs --check --since="$BASE"

      - name: Skill and marketplace checks
        run: CHECK_BASE_REF="$BASE" node scripts/check-skills.mjs

      - name: Claude Code plugin validation
        run: npx -y @anthropic-ai/claude-code plugin validate . --strict

      - name: Sync tests
        run: node --test scripts/*.test.mjs

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: remotion-video-master beat fitter still reads the bundled track
        run: |
          S=plugins/remotion-video-master/skills/remotion-video-master
          node $S/scripts/fit-beat-grid.mjs $S/assets/music/ende-business-moves-1.mp3 --json > "$RUNNER_TEMP/fit.json"
          node -e '
            const f = require(process.env.RUNNER_TEMP + "/fit.json");
            const want = [32, 96, 192, 256];
            if (Math.abs(f.bpm - 120) > 0.05) throw new Error("bpm " + f.bpm);
            if (f.firstBeatSeconds > 0.03) throw new Error("first beat " + f.firstBeatSeconds);
            if (JSON.stringify(f.liftBeats) !== JSON.stringify(want)) throw new Error("lifts " + f.liftBeats);
            console.log("ok", f.bpm, f.firstBeatSeconds, f.liftBeats);
          '

      - name: remotion-video-master scripts (length recommendations, declared-cut pops)
        run: node --test plugins/remotion-video-master/skills/remotion-video-master/scripts/*.test.mjs

      - name: seo-geo-master scripts (crawler, robots, schema, Search Console, shared libs)
        run: |
          S=plugins/seo-geo-master/skills/seo-geo-master/scripts
          node --test $S/*.test.mjs $S/lib/*.test.mjs

      # The render tests drive headless Chrome and skip themselves when none is found, so this
      # step fails if Chrome is missing (a skipped render test must never pass CI unnoticed).
      # The font-existence checks stay skipped: they need BRAND_NET=1 and the network.
      - name: brand-identity-master scripts (render, boards, palette, checks, shared libs)
        run: |
          S=plugins/brand-identity-master/skills/brand-identity-master/scripts
          node -e '
            import(process.argv[1]).then((m) => {
              const c = m.findChrome();
              if (!c) { console.error("No Chrome on this runner: the render tests would skip"); process.exit(1); }
              console.log("Chrome for the render tests:", c);
            });
          ' "$PWD/$S/lib/chrome.mjs"
          node --test $S/*.test.mjs $S/lib/*.test.mjs
